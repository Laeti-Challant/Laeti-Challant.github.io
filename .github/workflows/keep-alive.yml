name: Keep services awake

# Empêche Render et Supabase (plans gratuits) de se mettre en veille.
# Chaque jour, on appelle un endpoint qui interroge la base (/api/skills) :
# cela réveille l'API Render ET génère une requête DB qui garde Supabase active.
# Une simple visite du site ne suffit pas : le site est statique, il n'interroge
# pas la base.

on:
  schedule:
    # Tous les jours à 06:00 UTC (07:00/08:00 Paris selon l'heure d'été).
    - cron: '0 6 * * *'
  workflow_dispatch: # permet aussi de le lancer à la main pour tester

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (réveille Render + requête DB Supabase)
        run: |
          curl -sS --fail \
            --max-time 180 \
            --retry 5 --retry-delay 20 --retry-all-errors \
            -o /dev/null \
            -w "Ping OK : HTTP %{http_code} en %{time_total}s\n" \
            https://portfolio-api-kjs0.onrender.com/api/skills
